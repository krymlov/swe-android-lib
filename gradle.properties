# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel and Caching
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# Android Settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Release-only optimizations for resource library
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# None of these libraries has Kotlin sources, and without this the published POM carries a
# kotlin-stdlib dependency that every consumer then resolves for nothing. Measured on
# holidates-regions: the POM goes from one dependency to none.
kotlin.stdlib.default.dependency=false

# Maven Publication Metadata
AAR_ARTIFACT_ID=swe-android
AAR_GROUP_ID=swisseph
AAR_VERSION=2.10.03j6f

# Android Module Metadata
AAR_NAMESPACE=org.swisseph
AAR_VERSION_CODE=37
AAR_COMPILE_SDK=37
AAR_MIN_SDK=21
AAR_TARGET_SDK=36

# Generate BuildConfig only where the module's own code reads it
AAR_BUILD_CONFIG=false

# View binding only where the module actually has *Binding code
AAR_VIEW_BINDING=false
